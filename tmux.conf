set -g mouse on
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @vim_navigator_prefix_mapping_clear_screen ""

# --- session persistence ----------------------------------------------------
# resurrect: prefix + C-s saves, prefix + C-r restores.
# continuum: autosaves every 15 min and restores automatically when the tmux
# server starts, so attaching after a reboot brings back sessions/windows/panes.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
# continuum's periodic autosave rides on status-right and it silently disables
# itself if it thinks another tmux server is running, so also save on detach --
# that covers the detach/reattach case regardless.
set-hook -g client-detached 'run-shell "~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh"'

# keep manually-set window names -- they survive a resurrect restore, auto-renames don't
set-option -g allow-rename off
set-window-option -g automatic-rename off

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel


bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# --- vim-tmux-navigator: also treat OrbStack panes as vim -------------------
# The plugin decides whether to forward C-h/j/k/l by inspecting the process
# running in the pane. When nvim runs inside an OrbStack machine that process is
# `orb`, not `nvim`, so the check fails and tmux switches panes instead of
# forwarding the key -- which traps focus inside nvim's splits. Re-bind after
# tpm (so these win) with `orb`/`orbctl` added to the pattern.
#
# Trade-off: tmux cannot see into the VM, so it now forwards these keys for ANY
# orb pane, including a plain shell. From a non-nvim orb pane, switch panes with
# the prefix (C-b) + h/j/k/l instead.
bind-key -n 'C-h' if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf|orbctl|orb)(diff)?(-wrapped)?$'" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf|orbctl|orb)(diff)?(-wrapped)?$'" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf|orbctl|orb)(diff)?(-wrapped)?$'" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf|orbctl|orb)(diff)?(-wrapped)?$'" 'send-keys C-l' 'select-pane -R'
